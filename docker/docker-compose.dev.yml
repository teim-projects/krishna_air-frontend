services:
  krisna-react-frontend-app:
    container_name: frontend-dev
    image: frontend-dev-v1
    build:
      context: .. 
      dockerfile: docker/Dockerfile.dev
      args:
        VITE_BASE_API_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: 129181997839-0rlmm080229tetuka9c0i83la4r4lhdt.apps.googleusercontent.com

    ports:
      - "5173:5173"
    
    volumes:
      - ..:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_BASE_API_URL=http://localhost:8000   
      - VITE_GOOGLE_CLIENT_ID=129181997839-0rlmm080229tetuka9c0i83la4r4lhdt.apps.googleusercontent.com

    command: npm run dev

